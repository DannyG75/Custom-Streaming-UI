# Home server media stack: Immich (photos) + Jellyfin (videos).
# Run from the repo root after copying .env.example -> .env.
#
#   docker compose pull
#   docker compose up -d
#
# Both services write data to the external HDD mounted at $MEDIA_ROOT (/mnt/media).

name: home-server

services:
  # ----------------------------------------------------------------------
  # Immich — photo & video backup with mobile app, ML search, timeline UI
  # ----------------------------------------------------------------------
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    restart: unless-stopped
    depends_on:
      - immich-redis
      - immich-postgres
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: immich-redis
    ports:
      - "2283:2283"

  immich-machine-learning:
    container_name: immich-ml
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    restart: unless-stopped
    volumes:
      - immich-model-cache:/cache

  immich-redis:
    container_name: immich-redis
    image: docker.io/redis:6.2-alpine
    restart: unless-stopped

  immich-postgres:
    container_name: immich-postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ----------------------------------------------------------------------
  # Jellyfin — video library streaming
  # ----------------------------------------------------------------------
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: 1000:1000
    network_mode: host
    volumes:
      - ${JELLYFIN_CONFIG_DIR}:/config
      - ${JELLYFIN_CACHE_DIR}:/cache
      - ${JELLYFIN_MEDIA_DIR}:/media
    environment:
      JELLYFIN_PublishedServerUrl: http://localhost:8096

volumes:
  immich-model-cache:
  postgres-data:
